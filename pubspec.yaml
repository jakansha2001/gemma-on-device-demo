name: gemma_vision_demo
description: "On-device AI showcase: vision, thinking, function calling and a full voice loop, running entirely offline via flutter_edge_ai."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- flutter_edge_ai is modular -----------------------------------------
  # `flutter_edge_ai` (the package formerly called flutter_gemma; renamed in
  # 2.0.0) is only the core: it registers NO inference engine on its own, so
  # an app must add the engine package(s) for the model formats it ships and
  # wire them in FlutterEdgeAi.initialize(). We ship exactly one format
  # (.litertlm), which covers Android + iOS + macOS from a single model file —
  # so no flutter_edge_ai_mediapipe, and no MediaPipe native payload.
  flutter_edge_ai: ^2.1.1
  flutter_edge_ai_litertlm: ^1.10.1
  # STT + TTS + the VoiceSession loop. Native only; rides on litertlm's
  # bundled native library, so it adds no second copy of libLiteRtLm.
  flutter_edge_ai_speech: ^0.5.4

  # Renders the model's markdown. `flutter_markdown` is discontinued as of
  # 2025; gpt_markdown is actively maintained and built for LLM output, which
  # matters here because we render PARTIAL markdown on every streamed token.
  gpt_markdown: ^1.2.1
  # Pulled in transitively by gpt_markdown, but we reference Math.tex directly
  # for the malformed-LaTeX fallback, so declare it explicitly.
  flutter_math_fork: ^0.7.4

  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Voice loop I/O. VoiceSession owns neither microphone nor speaker: the app
  # captures 16 kHz mono PCM and plays the reply back.
  record: ^6.0.0
  just_audio: ^0.9.36
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The demo has its own identity, on purpose: the slides are Google Sans on a
  # cool near-black, so an app that looked the same dissolved into the slide
  # behind it when a recording was dropped into a laptop mockup. Bricolage
  # Grotesque sets the headings (personality where it is looked at), Inter
  # sets everything that is actually read, and JetBrains Mono sets code and
  # JSON. All three are SIL Open Font License 1.1 — the licence text ships
  # beside the files.
  #
  # They are bundled rather than fetched at runtime (as the google_fonts
  # package does) because this app's whole claim is that it touches the
  # network exactly once, for the model.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
