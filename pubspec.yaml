name: gemma_vision_demo
description: "On-device AI showcase: vision, thinking, function calling and a full voice loop, running entirely offline via flutter_gemma."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- flutter_gemma 1.x is modular ---------------------------------------
  # `flutter_gemma` is only the core: it registers NO inference engine on its
  # own, so an app must add the engine package(s) for the model formats it
  # ships and wire them in FlutterGemma.initialize(). We ship exactly one
  # format (.litertlm), which covers Android + iOS + macOS from a single model
  # file — so no flutter_gemma_mediapipe, and no MediaPipe native weight.
  flutter_edge_ai: ^2.1.1
  flutter_edge_ai_litertlm: ^1.10.1
  # STT + TTS + the VoiceSession loop. Native only; rides on litertlm's
  # bundled native library, so it adds no second copy of libLiteRtLm.
  flutter_edge_ai_speech: ^0.5.4

  # Renders the model's markdown. `flutter_markdown` is discontinued as of
  # 2025; gpt_markdown is actively maintained and built for LLM output, which
  # matters here because we render PARTIAL markdown on every streamed token.
  gpt_markdown: ^1.2.1
  # Pulled in transitively by gpt_markdown, but we reference Math.tex directly
  # for the malformed-LaTeX fallback, so declare it explicitly.
  flutter_math_fork: ^0.7.4

  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Voice loop I/O. VoiceSession owns neither microphone nor speaker: the app
  # captures 16 kHz mono PCM and plays the reply back.
  record: ^6.0.0
  just_audio: ^0.9.36
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
